spring.application.name=demo-test
# 1. H2 인메모리 DB 설정 (테스트 시작 시 메모리에 생성, 끝나면 자동 삭제)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 2. JPA 테이블 자동 생성 (테스트 시작 시 테이블 만들고, 끝나면 날림)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# 3. 테스트용 고정 JWT Secret (32글자 이상)
jwt.secret=dGhpc2lzYXRlc3RzZWNyZXRrZXlmb3Jqd3R0ZXN0aW5ncHVycG9zZXM=

# 1. 파일 1개당 최대 허용 용량 (5MB)
spring.servlet.multipart.max-file-size=5MB
# 2. 한 번의 요청에 담길 수 있는 전체 데이터 최대 용량 (5MB)
spring.servlet.multipart.max-request-size=5MB
# 3. 파일이 저장될 기본 폴더 경로 (프로젝트 루트의 uploads 폴더)
file.upload-dir=uploads/